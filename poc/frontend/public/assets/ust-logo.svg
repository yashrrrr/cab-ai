<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="UST logo">
  <defs>
    <linearGradient id="ustBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1ad19f"/>
      <stop offset="55%" stop-color="#0f6e56"/>
      <stop offset="100%" stop-color="#093f32"/>
    </linearGradient>
    <linearGradient id="ustGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="ustShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#03231b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 4px margin on every side leaves room for the drop shadow to render
       without being clipped by the <img> viewBox boundary -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#ustBg)" filter="url(#ustShadow)"/>
  <rect x="4" y="4" width="56" height="24" rx="12" fill="url(#ustGloss)"/>
  <rect x="5" y="5" width="54" height="54" rx="11" fill="none" stroke="#ffffff" stroke-opacity="0.15"/>

  <text x="23" y="27" textLength="18" lengthAdjust="spacing" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">U ·</text>
  <text x="20" y="45" textLength="24" lengthAdjust="spacing" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">S T</text>
</svg>
